function pad2(v){return String(v).padStart(2,"0")}
function splitCustomerDate(value){
  const m=clean(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const now=new Date();
  return m
    ? {year:m[1],month:m[2],day:m[3]}
    : {year:String(now.getFullYear()),month:pad2(now.getMonth()+1),day:pad2(now.getDate())};
}
function monthLabel(num){
  const key=pad2(num);
  const row=MONTHS.find(x=>x[0]===key);
  return row?`${row[0]} - ${row[1]}`:key;
}
function parseMonthInput(value){
  const raw=clean(value).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const number=raw.match(/\d{1,2}/);
  if(number){
    const n=Number(number[0]);
    if(n>=1&&n<=12)return pad2(n);
  }
  const normalized=raw.replace(/\s+/g," ").toLowerCase();
  const byName=MONTHS.find(x=>normalized.includes(x[1].toLowerCase()));
  return byName?byName[0]:"";
}
function buildCustomerDate(fd){
  const year=Number(clean(fd.get("customerYear")));
  const month=parseMonthInput(fd.get("customerMonth"));
  const day=Number(clean(fd.get("customerDay")));
  if(!Number.isInteger(year)||year<1900||year>2200||!month||!Number.isInteger(day)||day<1||day>31)return "";
  const maxDay=new Date(year,Number(month),0).getDate();
  if(day>maxDay)return "";
  return `${year}-${month}-${pad2(day)}`;
}
function formatCustomerDate(value){
  const p=splitCustomerDate(value);
  const row=MONTHS.find(x=>x[0]===p.month);
  return `${Number(p.day)} ${row?row[1]:p.month} ${p.year}`;
}
function yearOptions(){
  const current=new Date().getFullYear();
  let html="";
  for(let y=current+1;y>=current-12;y--)html+=`<option value="${y}"></option>`;
  return html;
}
function dayOptions(){
  let html="";
  for(let d=1;d<=31;d++)html+=`<option value="${d}"></option>`;
  return html;
}

let fbp=null;
async function fb(){
  if(fbp)return fbp;
  fbp=Promise.all([
    import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`)
  ]).then(([a,u,s])=>{
    const app=a.getApps().length?a.getApps()[0]:a.initializeApp(FIREBASE_CONFIG);
    return{auth:u.getAuth(app),u,db:s.getFirestore(app),s};
  });
  return fbp;
}
function toast(t,type=""){
  let e=$("#toast");
  e.textContent=t;

  clearTimeout(toast.t);

}
function authorizedUser(user){
  return !!(user&&clean(user.email).toLowerCase()===EMPLOYEE_EMAIL.toLowerCase());
}
async function ensureAuthorized(){
  const f=await fb();
  const user=f.auth.currentUser;
  if(!authorizedUser(user))throw new Error("UNAUTHORIZED_EMPLOYEE");
  return f;
}
async function startData(){
  if(state.unsub){try{state.unsub()}catch{}state.unsub=null}
  const f=await ensureAuthorized();
  state.loading=true;
  render();
  const q=f.s.query(
    f.s.collection(f.db,COL),
    f.s.orderBy("createdAt","desc"),
    f.s.limit(250)
  );
  state.unsub=f.s.onSnapshot(q,snap=>{
    state.rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    state.loading=false;
    render();
  },e=>{
    console.error("Firestore listener:",e);
    state.loading=false;
    toast("تعذر تحميل بيانات العملاء","error");
    render();
  });
}

let clearingDeleted=false;
async function clearAllDeleted(){
  if(clearingDeleted)return;
  const rows=deleted();
  if(!rows.length){toast("لا توجد سجلات محذوفة");return}
  if(!confirm(`تأكيد الحذف النهائي لجميع السجلات المحذوفة (${rows.length})؟ لا يمكن التراجع بعد ذلك.`))return;
  clearingDeleted=true;
  try{
    const f=await ensureAuthorized();
    const q=f.s.query(f.s.collection(f.db,COL),f.s.where("deleted","==",true));
    const snap=await f.s.getDocs(q);
    const docs=snap.docs;
    for(let i=0;i<docs.length;i+=400){
      const batch=f.s.writeBatch(f.db);
      docs.slice(i,i+400).forEach(d=>batch.delete(d.ref));
      await batch.commit();
    }
    toast("تم حذف جميع المحذوفين نهائياً","success");
  }finally{
    clearingDeleted=false;
  }
}

          <h4>${esc(r.customerName||"-")}</h4>
          <p>@${esc(r.username||"-")} • ${esc(SEC[r.section]||"-")}</p>
        </div>
        <span class="status ${r.status||"waiting"}">${esc(STATUS[r.status]||"-")}</span>
      </div>
      <div class="admin-customer-grid">
        <div class="meta"><small>المبلغ</small><b>${money(r.amount)}</b></div>
        <div class="meta"><small>نوع المهمة</small><b>${esc(r.taskType||"-")}</b></div>
        <div class="meta"><small>الموظف المستلم</small><b>${esc(r.employeeName||"-")}</b></div>
        <div class="meta"><small>المنصة</small><b>${esc(r.platform||"-")}</b></div>
        <div class="meta"><small>نوع الاشتراك</small><b>${esc(r.subscriptionType||"-")}</b></div>
        <div class="meta"><small>الكمية</small><b>${esc(r.quantity??"-")}</b></div>
        <div class="meta"><small>نوع الدفع</small><b>${esc(r.paymentType||"-")}</b></div>

}

let adminDirectMode=false;
let adminDirectSession=false;
let adminTapCount=0,adminTapTimer=null;
function adminLogoTap(){
  adminTapCount++;
  clearTimeout(adminTapTimer);
  adminTapTimer=setTimeout(()=>{adminTapCount=0},1100);
  if(adminTapCount>=3){
    adminTapCount=0;
    clearTimeout(adminTapTimer);
    window.__openEbdaaAdmin();
  }
}
document.querySelectorAll("[data-admin-logo]").forEach(el=>{
  el.style.cursor="pointer";
  el.addEventListener("click",adminLogoTap);
});
window.__openEbdaaAdmin=async function(){
  const code=prompt("أدخل رمز الإدارة");
  if(code!==ADMIN_SECRET){
    toast("رمز الإدارة غير صحيح","error");
    return;
  }

  let f=null;
  let createdDirectSession=false;

  try{
    open(`<div class="modal-bg" data-backdrop>
      <section class="modal" data-admin-panel style="width:min(1120px,100%)">
        <header class="modal-head">
          <h3>لوحة الإدارة</h3>
          <button class="x" data-close aria-label="إغلاق">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
        </header>
        <div class="modal-body">
          <div class="empty">
            <b>جاري فتح الإدارة…</b>
            <span>يتم تحميل بيانات العملاء والمبالغ.</span>
          </div>
        </div>
      </section>
    </div>`);

    f=await fb();

    // إذا لم تكن هناك جلسة موظفين، نسجل دخول Firebase بالخلفية
    // باستخدام نفس الرمز الذي أدخله المدير، بدون إظهار بوابة الموظفين.
    if(!authorizedUser(f.auth.currentUser)){
      adminDirectMode=true;

      const cred=await f.u.signInWithEmailAndPassword(
        f.auth,
        EMPLOYEE_EMAIL,
        code
      );

      if(!authorizedUser(cred.user)){
        try{await f.u.signOut(f.auth)}catch{}
        throw new Error("UNAUTHORIZED_EMPLOYEE");
      }

      adminDirectSession=true;
      createdDirectSession=true;
    }

    const snap=await f.s.getDocs(
      f.s.query(
        f.s.collection(f.db,COL),
        f.s.orderBy("createdAt","desc")
      )
    );

    const allRows=snap.docs.map(d=>({id:d.id,...d.data()}));
    const activeRows=allRows.filter(x=>x.deleted!==true);
    const s=statsFromRows(allRows);

    const body=$("#modal .modal-body");
    if(!body)return;

    body.innerHTML=`
      <div class="admin-summary">
        ${[
          ["إجمالي العملاء",s.total],
          ["إجمالي المبالغ",money(s.amount)],
          ["الدعم",s.support],
          ["الاسترجاع",s.recovery],
          ["قيد الانتظار",s.waiting],
          ["قيد المراجعة",s.review],
          ["قيد المعالجة",s.processing],
          ["مكتمل",s.completed],
          ["المحذوفين",s.deleted],
          ["أكثر مهمة",s.task],
          ["أكثر موظف",s.employee],
          ["أكثر منصة",s.platform]
        ].map(([a,b])=>`
          <div class="admin-card">
            <small>${esc(a)}</small>
            <strong>${esc(b)}</strong>
          </div>
        `).join("")}
      </div>

      <div class="admin-toolbar">
        <h3>تفاصيل العملاء</h3>
        <span class="admin-count">${activeRows.length} عميل</span>
      </div>

      <div class="admin-list">
        ${adminCustomerCards(activeRows)}
      </div>
    `;
  }catch(err){
    console.error("Admin direct:",err);

    if(createdDirectSession||adminDirectSession){
      adminDirectSession=false;
      adminDirectMode=false;
      if(f){
        try{await f.u.signOut(f.auth)}catch{}
      }
    }else{
      adminDirectMode=false;
    }

    close();

    const codeName=String(err&&err.code||"");
    if(codeName.includes("invalid-credential")||codeName.includes("wrong-password")||codeName.includes("user-not-found")){
      toast("رمز الإدارة غير مطابق لحساب النظام","error");
    }else if(codeName.includes("network")){
      toast("تعذر الاتصال، تحقق من الإنترنت","error");
    }else{
      toast("تعذر فتح الإدارة حالياً","error");
    }
  }
}

function preventViewportZoom(){
  const stop=e=>e.preventDefault();
  ["gesturestart","gesturechange","gestureend"].forEach(type=>{
    document.addEventListener(type,stop,{passive:false});
  });
  document.addEventListener("touchmove",e=>{
    if(e.touches&&e.touches.length>1)e.preventDefault();
  },{passive:false});
  document.addEventListener("dblclick",stop,{passive:false});
}
preventViewportZoom();

document.addEventListener("submit",async e=>{
  if(e.target.id==="loginForm"){
    e.preventDefault();
    const btn=$("#loginBtn"),old=btn.textContent;
    btn.disabled=true;
    btn.textContent="جاري التحقق…";
    try{
      adminDirectMode=false;
      adminDirectSession=false;
      const f=await fb();
      const cred=await f.u.signInWithEmailAndPassword(
        f.auth,
        clean($("#email").value),
        $("#pass").value
      );
      if(!authorizedUser(cred.user)){
        await f.u.signOut(f.auth);
        throw new Error("UNAUTHORIZED_EMPLOYEE");
      }
      $("#auth").classList.add("hidden");
      $("#app").classList.remove("hidden");
      await startData();
      toast("تم تسجيل الدخول بنجاح","success");
    }catch(err){
      console.error("Authentication:",err);
      const code=String(err&&err.code||"");
      if(String(err&&err.message||"")==="UNAUTHORIZED_EMPLOYEE"){
        toast("هذا الحساب غير مخول للدخول","error");
      }else if(code.includes("invalid-credential")||code.includes("wrong-password")||code.includes("user-not-found")){
        toast("البريد الإلكتروني أو الرمز السري غير صحيح","error");
      }else if(code.includes("too-many-requests")){
        toast("محاولات كثيرة، انتظر قليلاً ثم حاول مرة أخرى","error");
      }else if(code.includes("network")){
        toast("تعذر الاتصال، تحقق من الإنترنت","error");
      }else{
        toast("تعذر تسجيل الدخول حالياً","error");
      }
    }finally{
      btn.disabled=false;
      btn.textContent=old;
    }
  }
  if(e.target.id==="customerForm"){e.preventDefault();let fd=new FormData(e.target),p={customerName:clean(fd.get("customerName")),username:clean(fd.get("username")).replace(/^@/,""),deviceNumber:clean(fd.get("deviceNumber")),section:clean(fd.get("section")),subscriptionType:clean(fd.get("subscriptionType")),quantity:Number(fd.get("quantity")),platform:clean(fd.get("platform")),paymentType:clean(fd.get("paymentType")),amount:Number(fd.get("amount")),customerDate:buildCustomerDate(fd),taskType:clean(fd.get("taskType")),employeeName:clean(fd.get("employeeName")),status:clean(fd.get("status")),notes:clean(fd.get("notes"))};if(!p.customerDate){toast("تحقق من السنة والشهر واليوم","error");return}if(Object.values(p).some(v=>v===""||Number.isNaN(v))){toast("جميع معلومات العميل إجبارية","error");return}let id=clean(fd.get("editId"));try{id?await editRow(id,p):await addRow(p);close();toast(id?"تم حفظ التعديل":"تمت إضافة العميل","success")}catch(err){console.error(err);toast("تعذر حفظ العميل","error")}}})
document.addEventListener("input",e=>{if(e.target.id==="search"){state.q=e.target.value;cancelAnimationFrame(state.searchFrame||0);state.searchFrame=requestAnimationFrame(refreshSearchResults)}})
document.addEventListener("click",async e=>{
  if(e.target.closest("#backBtn")){
    if(state.view!=="home") setView("home");
    return;
  }
  if(e.target.closest("#themeBtn")){
    applyTheme(document.body.classList.contains("theme-dark")?"light":"dark");
    return;
  }
  if(e.target.closest("[data-clear-deleted]")){
    try{await clearAllDeleted()}catch(err){console.error(err);toast("تعذر حذف جميع المحذوفين","error")}
    return;
  }let v=e.target.closest("[data-view]");if(v){setView(v.dataset.view);return}let s=e.target.closest("[data-section]");if(s){state.section=s.dataset.section;state.view="section";render();return}if(e.target.closest('[data-action="quick"]')){open(quick());return}let a=e.target.closest("[data-add]");if(a){close();open(modal(a.dataset.add));return}if(e.target.matches("[data-backdrop]")){close();return}if(e.target.closest("[data-close]")){close();return}let f=e.target.closest("[data-filter]");if(f){state.filter=f.dataset.filter;render();return}if(e.target.closest("[data-clear]")){state.q="";const s=$("#search");if(s){s.value="";s.focus()}refreshSearchResults();return}let d=e.target.closest("[data-details]");if(d){let r=state.rows.find(x=>x.id===d.dataset.details);if(r)open(details(r));return}let ed=e.target.closest("[data-edit]");if(ed){let r=state.rows.find(x=>x.id===ed.dataset.edit);if(r)open(modal("",r));return}let de=e.target.closest("[data-delete]");if(de){let r=state.rows.find(x=>x.id===de.dataset.delete);if(r&&confirm(`تأكيد حذف العميل ${r.customerName}؟`)){await markDeleted(r.id,true);toast("تم نقل العميل للمحذوفين","success")}return}let rs=e.target.closest("[data-restore]");if(rs){await markDeleted(rs.dataset.restore,false);toast("تم إرجاع العميل","success");return}})

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modal")&&$("#modal").innerHTML.trim()){
    close();
  }
});

applyTheme(localStorage.getItem(THEME_KEY)==="dark"?"dark":"light");

async function bootAuthentication(){
  try{
    const f=await fb();
    f.u.onAuthStateChanged(f.auth,async user=>{
      if(user&&authorizedUser(user)){
        if(adminDirectMode){
          // دخول الإدارة المباشر: لا نفتح واجهة الموظفين بالخلفية.
          $("#app").classList.add("hidden");
          $("#auth").classList.remove("hidden");
          return;
        }

        $("#auth").classList.add("hidden");
        $("#app").classList.remove("hidden");
        try{
          await startData();
        }catch(err){
          console.error("Startup data:",err);
          toast("تعذر فتح بيانات العملاء","error");
        }
      }else{
        if(user&&!authorizedUser(user)){
          try{await f.u.signOut(f.auth)}catch{}
        }
        if(state.unsub){try{state.unsub()}catch{}state.unsub=null}
        state.rows=[];
        $("#app").classList.add("hidden");
        $("#auth").classList.remove("hidden");
      }
    });
  }catch(err){
    console.error("Firebase startup:",err);
    $("#app").classList.add("hidden");
    $("#auth").classList.remove("hidden");
    toast("تعذر الاتصال بالنظام","error");
  }
}

bootAuthentication();
$("#logout").addEventListener("click",async()=>{
  try{
    if(state.unsub){try{state.unsub()}catch{}state.unsub=null}
    const f=await fb();
    await f.u.signOut(f.auth);
  }catch(err){
    console.error("Logout:",err);
  }
  state.rows=[];
  state.view="home";
  state.section="";
  state.filter="all";
  state.q="";
  $("#app").classList.add("hidden");
  $("#auth").classList.remove("hidden");
  toast("تم تسجيل الخروج");
})
</script>
